name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nunca dos despliegues a la vez; un push nuevo espera a que termine el anterior.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # En PRs solo se comprueba que compila (tipos + build). No se despliega nada.
  check:
    name: Build y tipos
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  # En main: build, migraciones de D1 y despliegue del Worker.
  deploy:
    name: Migraciones D1 + despliegue
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://las-primas-club.rdvl.net
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Primero el esquema y después el código, para que el código nuevo nunca vea tablas viejas.
      - name: Aplicar migraciones de D1
        run: npx wrangler d1 migrations apply DB --remote
      - name: Desplegar Worker
        run: npx wrangler deploy
      - name: Comprobar que la web responde
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://las-primas-club.rdvl.net/api/config)
            if [ "$code" = 200 ]; then echo "OK ($code)"; exit 0; fi
            echo "Intento $i: HTTP $code"; sleep 5
          done
          exit 1
